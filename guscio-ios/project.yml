# Il guscio iOS di Yourbea — si rigenera con: xcodegen generate
# Perché esiste: dentro Safari la posizione si ferma quando lo schermo si
# spegne, e per chi non vede l'app serve proprio mentre cammina col telefono
# in tasca. Il guscio tiene accesi GPS e microfono in sottofondo.
name: Yourbea
options:
  bundleIdPrefix: it.vdmdata
  deploymentTarget: { iOS: "16.0" }
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: T3524H28MX
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.0.0"
    # Il numero di build sale di uno a ogni pacchetto mandato ad Apple.
    # Su App Store Connect il 13/10 e' gia' salita la build 2 (versione 1.0.0),
    # e due pacchetti non possono avere lo stesso numero: si riparte da 3.
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
targets:
  Yourbea:
    type: application
    platform: iOS
    sources: [Yourbea]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.vdmdata.urbea
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Yourbea
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        # Solo iPhone. Con l'iPad dentro, Apple pretende che l'app giri in
        # tutti i versi e a finestra ridotta: Yourbea e' verticale e si usa
        # camminando col telefono in mano, e in verifica quella pretesa e'
        # un motivo di rifiuto. Per rimetterci l'iPad: "1,2".
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Yourbea/Info.plist
      properties:
        CFBundleDisplayName: Yourbea
        # Senza queste due righe l'Info.plist resta a "1.0" e build "1":
        # il numero scritto qui sopra non ci arriva, e Apple vede la versione
        # sbagliata dentro il pacchetto.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, location]
        NSLocationWhenInUseUsageDescription: "Yourbea ti dice dove sei e cosa hai intorno: senza la posizione non può farlo."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Serve anche con lo schermo spento, perché l'app ti accompagna mentre cammini col telefono in tasca."
        NSContactsUsageDescription: "Per avvisare chi scegli tu dicendo solo il suo nome: il numero lo prende dalla tua rubrica, così non devi scriverlo."
        # Il permesso si chiede solo quando si dice «leggi», e la frase deve
        # dire la cosa vera: Apple rifiuta le spiegazioni generiche, e una
        # frase generica non convince nemmeno la persona a dire sì.
        NSCameraUsageDescription: "Per leggere ad alta voce quello che hai davanti: cartelli delle strade, numeri dell'autobus, citofoni, menu ed etichette. La fotocamera si accende solo quando dici «leggi», la fotografia resta nel telefono e non viene salvata."
        NSMicrophoneUsageDescription: "Per capire quando dici «dove sono», «approfondisci» o «portami a»."
        NSSpeechRecognitionUsageDescription: "Quello che dici viene trascritto per capire la richiesta: «dove sono», «approfondisci», «portami a via Roma»."
        ITSAppUsesNonExemptEncryption: false
