<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070A0E">
<title>Yourbea</title>
<!-- QUESTO E' L'INDIRIZZO CHE I PROVATORI HANNO GIA'.
     Dal 15/10/2026 Yourbea e' stata rifatta da zero e vive in ./nuova/.
     Questa pagina non e' un semplice rimando: prima SPEGNE il service
     worker della vecchia app. Senza, chi l'aveva installata avrebbe
     continuato a vedersi servire la vecchia dalla propria cassaforte,
     per sempre, qualunque cosa pubblichiamo. La vecchia resta leggibile
     su ./vecchia.html finche' serve. -->
<style>
  html,body{margin:0;height:100%}
  body{background:#070A0E;color:#E9E8E4;font-family:-apple-system,system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       text-align:center;padding:24px;line-height:1.5}
  h1{font-family:Georgia,serif;letter-spacing:.14em;color:#E7C65A;font-size:26px;margin:0 0 10px}
  p{color:#C9CDD3;max-width:30em;margin:0 0 18px}
  a{display:inline-block;background:#5BE3FF;color:#06202A;text-decoration:none;
    font-weight:600;padding:18px 26px;border-radius:16px;min-height:60px;font-size:18px}
</style>
</head>
<body>
<h1>YOURBEA</h1>
<p id="dice">Yourbea è stata rifatta: ti porto alla versione nuova.</p>
<a id="vai" href="./nuova/">Apri Yourbea</a>
<script>
(function () {
  /* 1. via la cassaforte della vecchia, se c'è */
  var fatto = Promise.resolve();
  if ('serviceWorker' in navigator) {
    fatto = navigator.serviceWorker.getRegistrations().then(function (regs) {
      return Promise.all(regs.map(function (r) {
        /* quello della nuova app ha lo scope .../nuova/ e non si tocca */
        return (r.scope || '').indexOf('/nuova/') >= 0 ? null : r.unregister();
      }));
    }).catch(function () {});
  }
  var pulisci = (window.caches && caches.keys) ? caches.keys().then(function (nomi) {
    return Promise.all(nomi.filter(function (n) { return n.indexOf('nuova') < 0; })
                            .map(function (n) { return caches.delete(n); }));
  }).catch(function () {}) : Promise.resolve();

  /* 2. e poi si va, lasciando il tempo alla pulizia ma senza restare
     appesi se qualcosa non risponde: in silenzio non si lascia nessuno. */
  var andato = false;
  function vai() { if (!andato) { andato = true; location.replace('./nuova/'); } }
  Promise.all([fatto, pulisci]).then(vai);
  setTimeout(vai, 2500);
})();
</script>
</body>
</html>
